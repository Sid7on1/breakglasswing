name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  id-token: write
  attestations: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    name: Build · attest · publish
    runs-on: macos-15
    env:
      PUPPETEER_SKIP_DOWNLOAD: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
          cache-dependency-path: tui/go.sum
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Verify tag and select release mode
        id: release_mode
        shell: bash
        env:
          APPLE_DEVELOPER_ID_P12_BASE64: ${{ secrets.APPLE_DEVELOPER_ID_P12_BASE64 }}
          APPLE_DEVELOPER_ID_P12_PASSWORD: ${{ secrets.APPLE_DEVELOPER_ID_P12_PASSWORD }}
          APPLE_NOTARY_PRIVATE_KEY: ${{ secrets.APPLE_NOTARY_PRIVATE_KEY }}
          APPLE_NOTARY_KEY_ID: ${{ secrets.APPLE_NOTARY_KEY_ID }}
          APPLE_NOTARY_ISSUER_ID: ${{ secrets.APPLE_NOTARY_ISSUER_ID }}
        run: |
          set -euo pipefail
          expected="v$(node -p "require('./package.json').version")"
          [ "$GITHUB_REF_NAME" = "$expected" ] || {
            echo "::error::tag $GITHUB_REF_NAME does not match package version $expected"; exit 1; }
          required=(APPLE_DEVELOPER_ID_P12_BASE64 APPLE_DEVELOPER_ID_P12_PASSWORD APPLE_NOTARY_PRIVATE_KEY APPLE_NOTARY_KEY_ID APPLE_NOTARY_ISSUER_ID)
          signing_available=true
          for name in "${required[@]}"; do
            if [ -z "${!name}" ]; then
              signing_available=false
            fi
          done
          echo "signing_available=$signing_available" >> "$GITHUB_OUTPUT"
          if [ "$signing_available" = true ]; then
            echo "RELEASE_TITLE=Bimax CLI $GITHUB_REF_NAME" >> "$GITHUB_ENV"
          else
            echo "::warning::Apple credentials are unavailable; publishing an unsigned macOS beta with GitHub artifact attestations"
            echo "RELEASE_TITLE=Bimax CLI $GITHUB_REF_NAME (unsigned macOS beta)" >> "$GITHUB_ENV"
          fi

      - name: Install build dependencies
        run: npm ci

      - name: Build release matrix
        run: ./release.sh

      - name: Import Developer ID certificate
        if: steps.release_mode.outputs.signing_available == 'true'
        shell: bash
        env:
          APPLE_DEVELOPER_ID_P12_BASE64: ${{ secrets.APPLE_DEVELOPER_ID_P12_BASE64 }}
          APPLE_DEVELOPER_ID_P12_PASSWORD: ${{ secrets.APPLE_DEVELOPER_ID_P12_PASSWORD }}
          APPLE_NOTARY_PRIVATE_KEY: ${{ secrets.APPLE_NOTARY_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          keychain="$RUNNER_TEMP/bimax-signing.keychain-db"
          certificate="$RUNNER_TEMP/developer-id.p12"
          notary_key="$RUNNER_TEMP/AuthKey.p8"
          keychain_password="$(openssl rand -hex 24)"

          printf '%s' "$APPLE_DEVELOPER_ID_P12_BASE64" | base64 -D > "$certificate"
          printf '%s' "$APPLE_NOTARY_PRIVATE_KEY" > "$notary_key"
          chmod 600 "$certificate" "$notary_key"

          security create-keychain -p "$keychain_password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$keychain_password" "$keychain"
          security import "$certificate" -k "$keychain" -P "$APPLE_DEVELOPER_ID_P12_PASSWORD" -A -t cert -f pkcs12
          security set-key-partition-list -S apple-tool:,apple: -s -k "$keychain_password" "$keychain"
          security list-keychains -d user -s "$keychain"

          identity="$(security find-identity -v -p codesigning "$keychain" | awk -F'"' '/Developer ID Application/ { print $2; exit }')"
          [ -n "$identity" ] || { echo "::error::P12 has no Developer ID Application identity"; exit 1; }
          echo "BIMAX_MACOS_SIGN_IDENTITY=$identity" >> "$GITHUB_ENV"
          echo "APPLE_NOTARY_KEY_PATH=$notary_key" >> "$GITHUB_ENV"

      - name: Sign and notarize macOS binaries
        if: steps.release_mode.outputs.signing_available == 'true'
        env:
          APPLE_NOTARY_KEY_ID: ${{ secrets.APPLE_NOTARY_KEY_ID }}
          APPLE_NOTARY_ISSUER_ID: ${{ secrets.APPLE_NOTARY_ISSUER_ID }}
        run: ./scripts/sign-notarize-macos.sh

      - name: Verify release archives
        run: |
          cd build
          shasum -a 256 -c SHA256SUMS
          tar -xOzf bimax-darwin-arm64.tar.gz bimax-darwin-arm64 > /dev/null
          tar -xOzf bimax-darwin-x64.tar.gz bimax-darwin-x64 > /dev/null

      - name: Attest release provenance
        uses: actions/attest@v4
        with:
          subject-path: |
            build/bimax-darwin-arm64.tar.gz
            build/bimax-darwin-x64.tar.gz
            build/bimax-linux-x64.tar.gz
            build/bimax-linux-arm64.tar.gz
            build/SHA256SUMS

      - name: Prepare release notes
        shell: bash
        run: |
          if [ "${{ steps.release_mode.outputs.signing_available }}" = true ]; then
            cp docs/CLI_V1_RELEASE.md "$RUNNER_TEMP/release-notes.md"
          else
            {
              echo "> **macOS beta notice:** These builds are unsigned because Apple Developer credentials are not configured. Verify the checksum and GitHub artifact attestation before use; macOS may display a first-run security warning."
              echo
              cat docs/CLI_V1_RELEASE.md
            } > "$RUNNER_TEMP/release-notes.md"
          fi

      - name: Publish GitHub release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" build/bimax-darwin-arm64.tar.gz build/bimax-darwin-x64.tar.gz build/bimax-linux-x64.tar.gz build/bimax-linux-arm64.tar.gz build/SHA256SUMS --verify-tag --title "$RELEASE_TITLE" --notes-file "$RUNNER_TEMP/release-notes.md"
