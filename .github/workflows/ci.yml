name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel superseded runs on the same ref so the required check reflects the latest push.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  engine:
    name: Engine (typecheck · lint · test)
    runs-on: ubuntu-latest
    env:
      # Tests mock the browser; never pull ~150MB of Chromium in CI.
      PUPPETEER_SKIP_DOWNLOAD: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      # bubblewrap enables the Linux Bash-sandbox parity test (writes outside cwd must be denied).
      - name: Install bubblewrap (Linux sandbox backend)
        run: sudo apt-get update && sudo apt-get install -y bubblewrap
      - run: npm ci
      - name: Typecheck + build
        run: npm run build
      - name: Lint (warnings allowed; errors fail)
        run: npm run lint
      - name: Protocol contract fixtures are up to date
        run: |
          npm run gen:protocol
          git diff --exit-code -- src/protocol || {
            echo "::error::protocol fixtures drifted — run 'npm run gen:protocol' and commit"; exit 1; }
      - name: Test
        run: npm run test:ci

  app:
    name: App (typecheck · build · protocol mirror)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: app/package-lock.json
      # The app keeps a hand-written mirror of the engine's wire contract; this gate fails the
      # build the moment the mirror's version or message vocabulary drifts from src/protocol.
      - name: Protocol mirror in sync with engine
        run: npm run check:protocol-mirror
      - run: npm ci
        working-directory: app
      - name: Typecheck
        run: npm run typecheck
        working-directory: app
      - name: Build (electron-vite bundles; no packaging)
        run: npm run build
        working-directory: app

  tui:
    name: TUI (build · test)
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: tui
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
          cache-dependency-path: tui/go.sum
      - run: go build ./...
      - run: go vet ./...
      - run: go test ./...
