version: '3.8'

services:
  agent:
    build: .
    ports:
      - "8080:8080"
    environment:
      - DATABASE_URL=postgres://agent_user:agent_pass@db:5432/breakglasswing
      - AGENT_PORT=8080
    env_file:
      - .env.example
    depends_on:
      - db
    volumes:
      - ./src:/app/src
      - ./dist:/app/dist
      - breakglass_db:/app/.breakglass_db
      - breakglass_auth:/app/.breakglass_auth
      - breakglass_logs:/app/.breakglass_logs
      - breakglass_telemetry:/app/.breakglass_telemetry
      - breakglass_memory:/app/.breakglass_memory
      - breakglass_plugins:/app/.breakglass_plugins
      - breakglass_credits:/app/.breakglass_credits
      - breakglass_backup:/app/.breakglass_backup

  db:
    image: postgres:15-alpine
    environment:
      - POSTGRES_USER=agent_user
      - POSTGRES_PASSWORD=agent_pass
      - POSTGRES_DB=breakglasswing
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
  breakglass_db:
  breakglass_auth:
  breakglass_logs:
  breakglass_telemetry:
  breakglass_memory:
  breakglass_plugins:
  breakglass_credits:
  breakglass_backup:
