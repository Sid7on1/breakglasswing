# Bimax desktop packaging — DMG for macOS, NSIS installer for Windows.
# The headless engine (bun --compile, standalone — no Node on the host) is bundled as an
# extraResource; scripts/prepare-engine.sh must have compiled it for the TARGET platform/arch
# before electron-builder runs (the dist:* npm scripts sequence this).
appId: ai.bimax.app
productName: Bimax
directories:
  output: release
  buildResources: buildResources

files:
  - out/**
  # @lydell/node-pty is externalized by electron-vite (native N-API prebuilds) and must ship;
  # its platform binary lives in a @lydell/node-pty-<platform>-<arch> sibling package.
  - node_modules/@lydell/**

# Native binaries can't load from inside the asar archive.
asarUnpack:
  - node_modules/@lydell/**

# engine/ holds exactly one binary: bimax-engine (or bimax-engine.exe), compiled for the
# same platform+arch this build targets.
extraResources:
  - from: engine
    to: engine

asar: true

mac:
  category: public.app-category.developer-tools
  target:
    - dmg
  darkModeSupport: true
  # Release signing (see docs/SECURITY_INSTALL.md). Hardened runtime + entitlements are always
  # declared so that WHEN a Developer ID cert is present (CSC_LINK/CSC_KEY_PASSWORD, or one in the
  # keychain with CSC_IDENTITY_AUTO_DISCOVERY=true) electron-builder produces a correctly hardened,
  # signable app. With NO cert available, `identity: null` keeps local/dev builds unsigned instead of
  # failing. For a PUBLIC release, remove `identity: null` (or set MACOS via CSC_*) and set
  # `notarize` below, then verify on a clean Mac per the doc — do NOT claim notarization from a local
  # `codesign` pass alone.
  identity: null
  hardenedRuntime: true
  gatekeeperAssess: false
  entitlements: buildResources/entitlements.mac.plist
  entitlementsInherit: buildResources/entitlements.mac.plist
  # notarize: { teamId: "YOUR_TEAM_ID" }   # uncomment for release; needs APPLE_ID + APPLE_APP_SPECIFIC_PASSWORD

dmg:
  # DMG signing follows the app identity. Left off for unsigned dev builds; a signed release signs the
  # app inside the DMG (what Gatekeeper checks) via the mac.identity above.
  sign: false

win:
  target:
    - nsis

nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true

linux:
  target:
    - AppImage
  category: Development
